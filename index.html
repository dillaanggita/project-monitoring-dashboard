<!DOCTYPE html>
<html>
<head>
  <title>Project Monitoring Dashboard</title>
  <style>
    body { font-family: Arial; padding: 20px; background:#f5f5f5; }
    table { border-collapse: collapse; width:100%; background:white; }
    th, td { border:1px solid #ddd; padding:8px; }
    th { background:#333; color:white; }
  </style>
</head>
<body>

<h1>Project Monitoring Dashboard</h1>
<div id="status">Loading...</div>
<table id="table">
  <thead></thead>
  <tbody></tbody>
</table>

<script>
const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSUyXm7vNZVASoAA8-Xbc5Dfkdn75e5UfShXsUuE5Zi_rhZtB4WiiAPWHhwU3S0BINS7Ak3cxqUpXOx/pub?gid=1502631151&single=true&output=csv";

fetch(csvUrl)
  .then(res => res.text())
  .then(text => {
    document.getElementById("status").innerText = "Data Loaded";

    const rows = text.split("\n").map(r => r.split(","));
    const thead = document.querySelector("#table thead");
    const tbody = document.querySelector("#table tbody");

    thead.innerHTML = "<tr>" + rows[0].map(h => `<th>${h}</th>`).join("") + "</tr>";

    tbody.innerHTML = rows.slice(1).map(row =>
      "<tr>" + row.map(cell => `<td>${cell}</td>`).join("") + "</tr>"
    ).join("");
  })
  .catch(() => {
    document.getElementById("status").innerText = "ERROR LOAD DATA";
  });
</script>

</body>
</html>
